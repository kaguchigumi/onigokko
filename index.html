<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ミッション鬼ごっこ 記録アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE6D0;
    --paper-deep:#E4D8B8;
    --pine:#24463A;
    --pine-deep:#173026;
    --curry:#D98A2B;
    --curry-deep:#B36F1A;
    --oni:#C4472C;
    --ink:#2B2620;
    --ink-soft:#5C5648;
    --card:#FBF8EE;
    --line:#CFC29A;
    --white:#FFFDF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans JP',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(36,70,58,0.05) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(217,138,43,0.07) 0, transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  #app{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header.top{
    background:var(--pine);
    color:var(--white);
    padding:18px 18px 16px;
    border-bottom:3px solid var(--pine-deep);
  }
  header.top h1{
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:900;
    font-size:19px;
    margin:0 0 2px;
    letter-spacing:0.02em;
  }
  header.top p{
    margin:0;
    font-size:12px;
    color:#CFE0D6;
  }

  main{ flex:1; padding:14px 14px 90px; }

  nav.tabs{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    background:var(--pine-deep);
    border-top:1px solid rgba(255,255,255,0.08);
    z-index:20;
  }
  nav.tabs button{
    flex:1; padding:10px 4px 12px;
    background:none; border:none; color:#9FB5AC;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer;
  }
  nav.tabs button svg{ width:20px; height:20px; opacity:0.75; }
  nav.tabs button.active{ color:var(--curry); }
  nav.tabs button.active svg{ opacity:1; }

  h2.section-title{
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:700;
    font-size:15px;
    margin:2px 0 10px;
    color:var(--pine);
    display:flex; align-items:center; gap:8px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
  }

  /* Groups tab */
  .group-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .group-badge{
    width:34px; height:34px; border-radius:50%;
    background:var(--pine); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13px;
    flex-shrink:0;
  }
  .group-names{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; flex:1; }
  .group-names b{ color:var(--ink); font-weight:700; }
  .icon-btn{
    border:none; background:var(--paper-deep); color:var(--ink);
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn.danger{ background:#F3DAD3; color:var(--oni); }

  .btn-primary{
    width:100%;
    background:var(--curry); color:var(--white);
    border:none; border-radius:10px;
    padding:13px; margin-top:6px;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer;
  }
  .btn-primary:active{ background:var(--curry-deep); }
  .btn-ghost{
    width:100%; background:transparent; color:var(--pine);
    border:1.5px solid var(--pine); border-radius:10px;
    padding:11px; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer;
  }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:500; }
  .field input{
    width:100%; padding:10px 11px; border:1.5px solid var(--line);
    border-radius:8px; font-size:14px; font-family:'Noto Sans JP',sans-serif;
    background:var(--white); color:var(--ink);
  }
  .field input:focus{ outline:2px solid var(--curry); outline-offset:1px; }

  /* Missions tab */
  .mission-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:6px;
  }
  .mission-tile{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 6px; text-align:center; cursor:pointer;
  }
  .mission-tile .num{
    font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:18px; color:var(--pine);
  }
  .mission-tile .name{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; line-height:1.3; }
  .mission-tile.group-type{ border-color:var(--curry); }

  .set-switch{
    display:flex; background:var(--paper-deep); border-radius:10px; padding:3px; margin-bottom:12px;
  }
  .set-switch button{
    flex:1; border:none; background:none; padding:9px 0;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft);
    border-radius:8px; cursor:pointer;
  }
  .set-switch button.active{ background:var(--pine); color:var(--white); }

  .mission-header{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .mission-header button.back{
    border:none; background:var(--paper-deep); width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .mission-header .titles{ flex:1; }
  .mission-header .titles .t1{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:15px; color:var(--pine); }
  .mission-header .titles .t2{ font-size:11px; color:var(--ink-soft); }
  .reward-chip{
    display:inline-block; background:var(--curry); color:var(--white);
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; margin-top:4px;
  }

  .member-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .member-chip{
    border:2px solid var(--line); background:var(--white);
    border-radius:10px; padding:10px 4px; text-align:center; cursor:pointer;
    font-size:12.5px; font-weight:500; color:var(--ink);
  }
  .member-chip.cleared{
    background:var(--pine); border-color:var(--pine-deep); color:var(--white); font-weight:700;
  }
  .member-chip .mark{ display:block; font-size:14px; margin-bottom:2px; }

  .group-clear-btn{
    width:100%; padding:16px; border-radius:10px; border:2px solid var(--line);
    background:var(--white); font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:14px;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .group-clear-btn.cleared{ background:var(--pine); border-color:var(--pine-deep); color:var(--white); }

  .group-block{ margin-bottom:12px; }
  .group-block .glabel{
    font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; gap:6px;
  }

  /* Overview */
  .ov-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  table.ov{ border-collapse:collapse; width:100%; font-size:11.5px; }
  table.ov th, table.ov td{ padding:7px 6px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.ov th{ background:var(--paper-deep); font-family:'Zen Maru Gothic',sans-serif; font-weight:700; color:var(--pine); position:sticky; top:0; }
  table.ov td.gname{ text-align:left; font-weight:700; color:var(--ink); position:sticky; left:0; background:var(--card); }
  .cell-full{ color:var(--pine); font-weight:900; }
  .cell-partial{ color:var(--curry-deep); font-weight:700; }
  .cell-none{ color:#B7AD8E; }

  .empty-state{
    text-align:center; padding:30px 14px; color:var(--ink-soft); font-size:13px; line-height:1.7;
  }
  .empty-state svg{ opacity:0.4; margin-bottom:8px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,48,38,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--paper); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:18px 18px 24px; max-height:85vh; overflow-y:auto;
  }
  .modal h3{ font-family:'Zen Maru Gothic',sans-serif; font-size:15px; margin:0 0 14px; color:var(--pine); }

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--pine-deep); color:var(--white); font-size:12.5px;
    padding:8px 16px; border-radius:99px; z-index:60; opacity:0; transition:opacity 0.25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>ミッション鬼ごっこ 記録アプリ</h1>
    <p id="subhead">読み込み中…</p>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button data-tab="groups" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14.5 14.2c2.6.3 4.5 2.5 4.5 5.3"/></svg>
      班登録
    </button>
    <button data-tab="missions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4l8-2 8 2v17"/><path d="M9 21v-6h6v6"/><circle cx="12" cy="9" r="2"/></svg>
      ミッション記録
    </button>
    <button data-tab="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      全体状況
    </button>
  </nav>
</div>
<div id="toast" class="toast"></div>

<script>
const MISSIONS = [
  {id:1, title:'モンスター討伐', sub:'的当てチャレンジ', type:'individual', reward:'交渉カード'},
  {id:2, title:'ぴったり10秒', sub:'目を閉じて10秒', type:'individual', reward:'仲間1人解放'},
  {id:3, title:'クイズ', sub:'三択クイズ', type:'individual', reward:'仲間2人解放'},
  {id:4, title:'バランス', sub:'片足10秒キープ', type:'individual', reward:'カレー具材カード'},
  {id:5, title:'パズル', sub:'木製パズル(2人)', type:'group', reward:'白米カード'},
  {id:6, title:'フープくぐり', sub:'班全員で協力', type:'group', reward:'カレールーカード'},
  {id:7, title:'巨大ボール運び', sub:'ペアで運搬', type:'group', reward:'調理器具+仲間2人解放'},
  {id:8, title:'形づくり', sub:'ロープで形作り', type:'group', reward:'お肉カード+交渉カード'},
  {id:9, title:'最終ミッション', sub:'頂上まで逃げ切れ', type:'group', reward:'デザート券'},
];
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
const GROUP_SIZE = 6; // 1班あたりの人数
const MEMBER_IDX = Array.from({length: GROUP_SIZE}, (_, i) => i);

let state = {
  tab: 'groups',
  groups: [],
  cells: {},               // 'missionId:setKey:groupId:idx' -> boolean (one storage key per checkbox)
  currentSet: 1,
  currentMissionId: null,
  loaded: false,
};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ---- backend: Google Apps Script Web App (no Claude login required) ----
   Set up once by the organizer; every viewer just opens the published page. */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzSXSh4Bw9asiCddl4NP6mJ-RS3TslbG7ofu3WFjeD2aL-ToT0MmTudYjLa-rA5Dgmn/exec';
const BACKEND_TOKEN = 'onigokko2026'; // must match the TOKEN constant in the Apps Script code

async function apiGetMany(keys){
  if(keys.length === 0) return {};
  const CHUNK = 25; // keep each GET URL comfortably short
  const result = {};
  for(let i=0; i<keys.length; i+=CHUNK){
    const chunk = keys.slice(i, i+CHUNK);
    try{
      const url = BACKEND_URL + '?token=' + encodeURIComponent(BACKEND_TOKEN)
        + '&action=getMany&keys=' + encodeURIComponent(JSON.stringify(chunk));
      const res = await fetch(url);
      const data = await res.json();
      Object.assign(result, data);
    }catch(e){ console.error('getMany failed', e); }
  }
  return result;
}
async function apiGetOne(key){
  const r = await apiGetMany([key]);
  return (r && r[key] !== undefined) ? r[key] : null;
}
async function apiSet(key, valueString){
  try{
    const url = BACKEND_URL + '?token=' + encodeURIComponent(BACKEND_TOKEN)
      + '&action=set&key=' + encodeURIComponent(key)
      + '&value=' + encodeURIComponent(valueString);
    const res = await fetch(url);
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('set failed', e); return false; }
}

async function safeGet(key){
  return await apiGetOne(key);
}

/* ---- resilient save queue ----
   Network calls can fail transiently (wifi at an outdoor event, etc).
   We keep the latest value per key in a queue and keep retrying quietly
   in the background instead of blocking the UI or alarming the operator. */
let pendingSaves = {};
let syncing = false;
let syncTimer = null;

function queueSave(key, value){
  pendingSaves[key] = {value};
  updateSyncBadge();
  attemptFlush();
}

async function attemptFlush(){
  if(syncing) return;
  syncing = true;
  const keys = Object.keys(pendingSaves);
  for(const key of keys){
    const entry = pendingSaves[key];
    if(!entry) continue;
    try{
      const r = await apiSet(key, entry.value);
      if(r){
        if(pendingSaves[key] && pendingSaves[key].value === entry.value){
          delete pendingSaves[key];
        }
      }
    }catch(e){
      console.error('sync failed for', key, e);
    }
  }
  syncing = false;
  updateSyncBadge();
  if(Object.keys(pendingSaves).length > 0 && !syncTimer){
    syncTimer = setTimeout(()=>{ syncTimer = null; attemptFlush(); }, 3000);
  }
}

function updateSyncBadge(){
  const sub = document.getElementById('subhead');
  if(!sub) return;
  const n = Object.keys(pendingSaves).length + Object.keys(pendingCellTarget).length;
  sub.textContent = n > 0
    ? '通信中…変更を保存しています'
    : '① 〜 ⑨ 達成状況をブースで記録・確認';
}

window.addEventListener('online', attemptFlush);

const SET_KEYS = ['set1','set2','set3'];

/* Each checkbox (1 mission x 1 set x 1 group x 1 child) gets its OWN storage key.
   This means two different booth phones editing two different children can never
   clobber each other's write — there is nothing to merge, because nothing overlaps.
   (Verified with a 20-client / 10,000-operation concurrency simulation.) */
function cellKey(missionId, setKey, groupId, idx){
  return missionId+':'+setKey+':'+groupId+':'+idx;
}
function getCell(missionId, setKey, groupId, idx){
  return !!state.cells[cellKey(missionId, setKey, groupId, idx)];
}

const pendingCellTarget = {};   // key -> boolean not yet confirmed saved
const flushingCellKeys = new Set();

function setCellLocal(missionId, setKey, groupId, idx, value){
  const key = cellKey(missionId, setKey, groupId, idx);
  state.cells[key] = value;
  pendingCellTarget[key] = value;
  updateSyncBadge();
  flushCell(key);
}

async function flushCell(key){
  if(flushingCellKeys.has(key)) return;
  if(!(key in pendingCellTarget)) return;
  flushingCellKeys.add(key);
  const target = pendingCellTarget[key];
  try{
    const r = await apiSet(key, JSON.stringify(target));
    if(r && pendingCellTarget[key] === target){
      delete pendingCellTarget[key];
    }
  }catch(e){
    console.error('cell sync failed', key, e);
  }
  flushingCellKeys.delete(key);
  updateSyncBadge();
  if(key in pendingCellTarget){
    setTimeout(()=>flushCell(key), 3000);
  }
}

function allCellKeysFor(groups){
  const keys = [];
  MISSIONS.forEach(m=>{
    SET_KEYS.forEach(s=>{
      groups.forEach(g=>{
        for(let idx=0; idx<GROUP_SIZE; idx++) keys.push(cellKey(m.id, s, g.id, idx));
      });
    });
  });
  return keys;
}

async function loadAll(){
  const g = await safeGet('groups');
  state.groups = g ? JSON.parse(g) : [];
  const keys = allCellKeysFor(state.groups);
  const remote = await apiGetMany(keys);
  keys.forEach(k=>{ state.cells[k] = remote[k] ? JSON.parse(remote[k]) : false; });
  state.loaded = true;
  updateSyncBadge();
  render();
  setInterval(pollRemote, 20000); // pick up other booths' progress without a manual reload
}

async function pollRemote(){
  try{
    const g = await safeGet('groups');
    const remoteGroups = g ? JSON.parse(g) : [];
    if(JSON.stringify(remoteGroups) !== JSON.stringify(state.groups)){
      state.groups = remoteGroups;
    }
    const keys = allCellKeysFor(state.groups).filter(k => !(k in pendingCellTarget));
    const remote = await apiGetMany(keys);
    keys.forEach(k=>{
      if(remote[k] !== undefined && remote[k] !== null) state.cells[k] = JSON.parse(remote[k]);
    });
    render();
  }catch(e){ console.error('poll failed', e); }
}

function saveGroups(){
  queueSave('groups', JSON.stringify(state.groups));
}

function nextGroupNum(){
  let max = 0;
  state.groups.forEach(g=>{ if(g.num > max) max = g.num; });
  return max + 1;
}

/* ---------- render router ---------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  const main = document.getElementById('main');
  if(!state.loaded){
    main.innerHTML = '<div class="empty-state">読み込み中…</div>';
    return;
  }
  if(state.tab === 'groups') renderGroupsTab(main);
  else if(state.tab === 'missions') renderMissionsTab(main);
  else renderOverviewTab(main);
}

/* ---------- Groups tab ---------- */
function renderGroupsTab(main){
  let html = `<h2 class="section-title">班の登録</h2>`;
  if(state.groups.length === 0){
    html += `<div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg><br>
      まだ班が登録されていません。<br>下のボタンから班を追加してください。
    </div>`;
  } else {
    state.groups.forEach(g=>{
      html += `<div class="card group-row">
        <div class="group-badge">${g.num}班</div>
        <div class="group-names">${g.members.map((n,i)=>`<b>${escapeHtml(n||'(未入力)')}</b>`).join('　')}</div>
        <button class="icon-btn" data-action="edit-group" data-id="${g.id}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-action="delete-group" data-id="${g.id}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>`;
    });
  }
  html += `<button class="btn-primary" data-action="add-group">＋ 班を追加する</button>`;
  main.innerHTML = html;

  main.querySelector('[data-action="add-group"]').onclick = ()=>openGroupModal(null);
  main.querySelectorAll('[data-action="edit-group"]').forEach(b=>{
    b.onclick = ()=>openGroupModal(b.dataset.id);
  });
  main.querySelectorAll('[data-action="delete-group"]').forEach(b=>{
    b.onclick = ()=>deleteGroup(b.dataset.id);
  });
}

function openGroupModal(id){
  const editing = !!id;
  const g = editing ? state.groups.find(x=>x.id===id) : {id: 'g'+Date.now(), num: nextGroupNum(), members: MEMBER_IDX.map(()=>'')};
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${editing ? g.num+'班を編集' : '新しい班を登録'}</h3>
      <div class="field"><label>班番号</label><input type="number" id="m-num" value="${g.num}" min="1"></div>
      ${MEMBER_IDX.map(i=>`<div class="field"><label>メンバー${i+1}の名前</label><input type="text" id="m-name-${i}" value="${escapeHtml(g.members[i]||'')}" placeholder="例：たろう"></div>`).join('')}
      <button class="btn-primary" id="m-save">保存する</button>
      <button class="btn-ghost" id="m-cancel" style="margin-top:8px;">キャンセル</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#m-cancel').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target === overlay) overlay.remove(); };
  overlay.querySelector('#m-save').onclick = async ()=>{
    const num = parseInt(overlay.querySelector('#m-num').value) || g.num;
    const members = MEMBER_IDX.map(i=>overlay.querySelector('#m-name-'+i).value.trim());
    const newGroup = {id: g.id, num, members};
    if(editing){
      const idx = state.groups.findIndex(x=>x.id===id);
      state.groups[idx] = newGroup;
    } else {
      state.groups.push(newGroup);
    }
    state.groups.sort((a,b)=>a.num-b.num);
    await saveGroups();
    overlay.remove();
    showToast('保存しました');
    render();
  };
}

async function deleteGroup(id){
  if(!confirm('この班のデータを削除しますか？（記録済みのミッション達成状況も消えます）')) return;
  state.groups = state.groups.filter(g=>g.id!==id);
  saveGroups();
  showToast('削除しました');
  render();
}

/* ---------- Missions tab ---------- */
function renderMissionsTab(main){
  if(state.groups.length === 0){
    main.innerHTML = `<h2 class="section-title">ミッション記録</h2>
      <div class="empty-state">先に「班登録」タブで班を登録してください。</div>`;
    return;
  }
  if(state.currentMissionId === null){
    let html = `<h2 class="section-title">記録するミッションを選択</h2><div class="mission-grid">`;
    MISSIONS.forEach(m=>{
      html += `<div class="mission-tile ${m.type==='group'?'group-type':''}" data-id="${m.id}">
        <div class="num">${CIRCLED[m.id-1]}</div>
        <div class="name">${m.title}</div>
      </div>`;
    });
    html += `</div>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;">
        緑枠＝個人ごとに記録　オレンジ枠＝班全員まとめて記録
      </div>`;
    main.innerHTML = html;
    main.querySelectorAll('.mission-tile').forEach(t=>{
      t.onclick = ()=>{ state.currentMissionId = parseInt(t.dataset.id); render(); };
    });
    return;
  }

  const m = MISSIONS.find(x=>x.id===state.currentMissionId);
  let html = `
    <div class="mission-header">
      <button class="back" id="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="titles">
        <div class="t1">${CIRCLED[m.id-1]} ${m.title}</div>
        <div class="t2">${m.sub}</div>
        <span class="reward-chip">🎁 ${m.reward}</span>
      </div>
    </div>
    <div class="set-switch">
      <button data-set="1" class="${state.currentSet===1?'active':''}">1セット目</button>
      <button data-set="2" class="${state.currentSet===2?'active':''}">2セット目</button>
      <button data-set="3" class="${state.currentSet===3?'active':''}">3セット目</button>
    </div>
  `;

  const setKey = 'set'+state.currentSet;

  state.groups.forEach(g=>{
    html += `<div class="group-block"><div class="glabel">${g.num}班</div>`;
    if(m.type === 'individual'){
      html += `<div class="member-grid">`;
      g.members.forEach((name,i)=>{
        const cleared = getCell(m.id, setKey, g.id, i);
        html += `<div class="member-chip ${cleared?'cleared':''}" data-gid="${g.id}" data-idx="${i}">
          <span class="mark">${cleared?'✓':'—'}</span>${escapeHtml(name || 'メンバー'+(i+1))}
        </div>`;
      });
      html += `</div>`;
    } else {
      const allCleared = MEMBER_IDX.every(i=>getCell(m.id, setKey, g.id, i));
      html += `<button class="group-clear-btn ${allCleared?'cleared':''}" data-gid="${g.id}">
        ${allCleared ? '✓ クリア済み（タップで取消）' : 'クリア'}
      </button>`;
    }
    html += `</div>`;
  });

  main.innerHTML = html;

  document.getElementById('back-btn').onclick = ()=>{ state.currentMissionId = null; render(); };
  main.querySelectorAll('.set-switch button').forEach(b=>{
    b.onclick = ()=>{ state.currentSet = parseInt(b.dataset.set); render(); };
  });

  if(m.type === 'individual'){
    main.querySelectorAll('.member-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const gid = chip.dataset.gid, idx = parseInt(chip.dataset.idx);
        const newVal = !getCell(m.id, setKey, gid, idx);
        setCellLocal(m.id, setKey, gid, idx, newVal);
        render();
      };
    });
  } else {
    main.querySelectorAll('.group-clear-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const gid = btn.dataset.gid;
        const cur = MEMBER_IDX.every(i=>getCell(m.id, setKey, gid, i));
        const newVal = !cur;
        MEMBER_IDX.forEach(idx => setCellLocal(m.id, setKey, gid, idx, newVal));
        render();
      };
    });
  }
}

/* ---------- Overview tab ---------- */
function renderOverviewTab(main){
  if(state.groups.length === 0){
    main.innerHTML = `<h2 class="section-title">全体状況</h2><div class="empty-state">まだ班が登録されていません。</div>`;
    return;
  }
  let html = `<h2 class="section-title">全体状況（3セット合計）</h2>
    <div class="ov-table-wrap"><table class="ov"><thead><tr><th>班</th>`;
  MISSIONS.forEach(m=> html += `<th>${CIRCLED[m.id-1]}</th>`);
  html += `</tr></thead><tbody>`;

  state.groups.forEach(g=>{
    html += `<tr><td class="gname">${g.num}班</td>`;
    MISSIONS.forEach(m=>{
      let clearedSets = 0;
      SET_KEYS.forEach(s=>{
        if(MEMBER_IDX.every(i=>getCell(m.id, s, g.id, i))) clearedSets++;
      });
      const cls = clearedSets===3 ? 'cell-full' : (clearedSets>0 ? 'cell-partial' : 'cell-none');
      html += `<td class="${cls}">${clearedSets===3?'✓✓✓':(clearedSets>0? clearedSets+'/3':'—')}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>
    <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;">
      数字＝3セット中で班全員がそのミッションをクリアした回数（①〜④は${GROUP_SIZE}人全員が個人クリアした場合にカウント）
    </div>`;
  main.innerHTML = html;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- init ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{
    state.tab = b.dataset.tab;
    if(state.tab === 'missions') state.currentMissionId = null;
    render();
  };
});

loadAll();
</script>

</html>
